<div class="login-container">
  <!-- Sección de imagen a la izquierda -->
  <div class="login-image-section">
    <div class="image-background"></div>
    <div class="image-overlay">
      <h1>Bienvenido al Club</h1>
      <p>Sistema de Gestión Deportiva - Accede para gestionar tu club</p>
    </div>
  </div>
  
  <!-- Sección de formulario a la derecha -->
  <div class="login-form-section">
    <div class="particles-background" id="particles"></div>
    <div class="login-wrapper">
        <div class="login-box">
            <!-- Icono de usuario más grueso y visible -->
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>

            <h2>Iniciar Sesión</h2>
            <p class="subtitle">Accede con tu cuenta</p>

            <div class="form-group">
                <label for="usuario">
                  <i class="" style="margin-right: 8px; color: #000;"></i>
                  Usuario
                </label>
                <div class="input-container">
                    <input type="text" id="usuario" [(ngModel)]="usuario" placeholder="Ingresa tu usuario" />
                    <span class="input-icon">
                        <i class="fas fa-user"></i>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label for="contrasena">
                  <i class="" style="margin-right: 8px; color: #000;"></i>
                Contraseña
                </label>
                <div class="input-container">
                    <input type="password" id="contrasena" [(ngModel)]="contrasena" placeholder="Ingresa tu contraseña" />
                    <span class="input-icon">
                        <i class="fas fa-lock"></i>
                    </span>
                </div>
            </div>

            <div class="login-options">
                <a href="/cambio" class="forgot-password">
                    <i class="fas fa-key"></i> ¿Olvidaste tu contraseña?
                </a>
            </div>

            <button (click)="login()" id="login-button">INGRESAR</button>

            <p class="error" *ngIf="mensaje">
                <i class="fas fa-exclamation-circle"></i> {{ mensaje }}
            </p>

            <div class="register-link">
                ¿No tienes una cuenta?
                <a href="/registro">
                    Regístrate <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
  </div>
</div>
